{% extends 'travels/base.html' %}

{% block title %}Upload de Comprovante{% endblock %}

{% block content %}
<div class="row mb-4">
    <div class="col">
        <h2><i class="bi bi-upload"></i> Upload de Comprovante</h2>
        <p class="text-muted">Viagem: {{ viagem.destino }}</p>
    </div>
</div>

<div class="card">
    <div class="card-body">
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Tipo de Anexo</label>
                {{ form.tipo }}
            </div>

            <div class="mb-3">
                <label class="form-label">Arquivo</label>
                {{ form.arquivo }}
                <small class="text-muted d-block">Formatos aceitos: PDF, JPG, PNG</small>
            </div>

            <div class="mb-3">
                <label class="form-label">Descrição</label>
                {{ form.descricao }}
            </div>

            <div class="d-flex justify-content-between">
                <a href="{% url 'editar_viagem' viagem.pk %}" class="btn btn-secondary">
                    <i class="bi bi-arrow-left"></i> Voltar
                </a>
                <button type="submit" class="btn btn-success">
                    <i class="bi bi-upload"></i> Fazer Upload
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
